<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队报名 - AI应用创新先锋大赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: rgba(255,255,255,0.7);
        }
        .back-link {
            color: #667eea;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 20px;
        }
        .form-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 40px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.9);
        }
        label .required {
            color: #ff6b6b;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        .category-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        .category-option {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .category-option:hover {
            border-color: #667eea;
        }
        .category-option input {
            display: none;
        }
        .category-option.selected {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .note {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回首页</a>
        
        <header>
            <h1>📝 团队报名</h1>
            <p class="subtitle">第一届AI应用创新先锋大赛</p>
        </header>

        <div class="form-card">
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>团队名称 <span class="required">*</span></label>
                        <input type="text" name="teamName" required placeholder="请输入团队名称">
                    </div>
                    <div class="form-group">
                        <label>所属部门 <span class="required">*</span></label>
                        <input type="text" name="department" required placeholder="请输入所属部门">
                    </div>
                </div>

                <div class="form-group">
                    <label>作品分类 <span class="required">*</span></label>
                    <div class="category-options">
                        <label class="category-option">
                            <input type="radio" name="category" value="sales" required>
                            <div>🏪 销售提效</div>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="category" value="supply">
                            <div>🚚 供应链优化</div>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="category" value="rd">
                            <div>💻 研发辅助</div>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="category" value="operation">
                            <div>⚙️ 内部运营</div>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="category" value="custom">
                            <div>✨ 自拟</div>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>作品名称 <span class="required">*</span></label>
                    <input type="text" name="projectName" required placeholder="请输入作品名称">
                </div>

                <div class="form-group">
                    <label>核心问题 <span class="required">*</span></label>
                    <textarea name="problem" required placeholder="描述项目解决的核心问题（200字以内）"></textarea>
                    <div class="note">请简明扼要地说明项目要解决的核心痛点</div>
                </div>

                <div class="form-group">
                    <label>MVP方案 <span class="required">*</span></label>
                    <textarea name="mvp" required placeholder="描述MVP方案的核心功能和实现思路"></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>队长姓名 <span class="required">*</span></label>
                        <input type="text" name="leaderName" required placeholder="请输入队长姓名">
                    </div>
                    <div class="form-group">
                        <label>队长手机 <span class="required">*</span></label>
                        <input type="tel" name="leaderPhone" required placeholder="请输入手机号">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>队长邮箱 <span class="required">*</span></label>
                        <input type="email" name="leaderEmail" required placeholder="请输入邮箱">
                    </div>
                    <div class="form-group">
                        <label>团队成员（选填）</label>
                        <input type="text" name="members" placeholder="用逗号分隔">
                    </div>
                </div>

                <button type="submit" class="btn-submit">提交报名</button>
            </form>
        </div>
    </div>

    <script>
        // 分类选项选中效果
        document.querySelectorAll('.category-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.category-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
            });
        });

        // 表单提交
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());
            console.log('提交数据:', data);
            
            // TODO: 提交到后端API
            alert('报名功能开发中，请稍后！');
        });
    </script>
</body>
</html>
