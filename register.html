<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>团队报名 - AI应用创新先锋大赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: rgba(255,255,255,0.7);
        }
        .back-link {
            color: #667eea;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 20px;
        }
        .form-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 40px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: rgba(255,255,255,0.9);
        }
        label .required {
            color: #ff6b6b;
        }
        input, select, textarea {
            width: 100%;
            padding: 14px 18px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        textarea {
            min-height: 120px;
            resize: vertical;
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
            }
        }
        .category-options {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 12px;
        }
        .category-option {
            background: rgba(255,255,255,0.05);
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .category-option:hover {
            border-color: #667eea;
        }
        .category-option input {
            display: none;
        }
        .category-option.selected {
            background: rgba(102, 126, 234, 0.2);
            border-color: #667eea;
        }
        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        .note {
            font-size: 13px;
            color: rgba(255,255,255,0.5);
            margin-top: 8px;
        }
        .upload-area {
            border: 2px dashed rgba(255,255,255,0.2);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.3s, background 0.3s;
            position: relative;
        }
        .upload-area:hover {
            border-color: #667eea;
            background: rgba(102,126,234,0.05);
        }
        .upload-area.drag-over {
            border-color: #667eea;
            background: rgba(102,126,234,0.1);
        }
        .upload-placeholder {
            color: rgba(255,255,255,0.5);
        }
        .upload-placeholder svg {
            margin-bottom: 8px;
            color: rgba(255,255,255,0.4);
        }
        .upload-placeholder p {
            margin: 4px 0;
            font-size: 15px;
        }
        .upload-placeholder span {
            font-size: 12px;
            opacity: 0.7;
        }
        .upload-success {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            color: #667eea;
            font-size: 14px;
        }
        .file-icon { font-size: 20px; }
        .remove-file {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 50%;
            color: rgba(255,255,255,0.6);
            width: 24px;
            height: 24px;
            cursor: pointer;
            font-size: 16px;
            line-height: 24px;
            transition: background 0.2s;
        }
        .remove-file:hover {
            background: rgba(255,100,100,0.3);
            color: #ff6b6b;
        }
        /* 成功提示弹窗 */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            z-index: 9999;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.show { display: flex; }
        .modal-card {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 1px solid rgba(102,126,234,0.4);
            border-radius: 24px;
            padding: 40px;
            max-width: 420px;
            width: 90%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(102,126,234,0.3);
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-icon {
            font-size: 56px;
            margin-bottom: 16px;
        }
        .modal-title {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }
        .modal-info {
            color: rgba(255,255,255,0.75);
            font-size: 15px;
            line-height: 1.7;
            margin-bottom: 24px;
        }
        .modal-btn {
            background: linear-gradient(135deg, #667eea, #764ba2);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            padding: 14px 40px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .modal-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(102,126,234,0.4);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回首页</a>
        
        <header>
            <h1>📝 团队报名</h1>
            <p class="subtitle">第一届AI应用创新先锋大赛</p>
        </header>

        <div class="form-card">
            <form id="registerForm">
                <div class="form-row">
                    <div class="form-group">
                        <label>团队名称 <span class="required">*</span></label>
                        <input type="text" name="teamName" required placeholder="请输入团队名称">
                    </div>
                    <div class="form-group">
                        <label>所属部门 <span class="required">*</span></label>
                        <input type="text" name="department" required placeholder="请输入所属部门">
                    </div>
                </div>

                <div class="form-group">
                    <label>作品分类 <span class="required">*</span></label>
                    <div class="category-options">
                        <label class="category-option">
                            <input type="radio" name="category" value="sales" required>
                            <div>🏪 销售提效</div>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="category" value="supply">
                            <div>🚚 供应链优化</div>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="category" value="rd">
                            <div>💻 研发辅助</div>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="category" value="operation">
                            <div>⚙️ 内部运营</div>
                        </label>
                        <label class="category-option">
                            <input type="radio" name="category" value="custom">
                            <div>✨ 自拟</div>
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label>作品名称 <span class="required">*</span></label>
                    <input type="text" name="projectName" required placeholder="请输入作品名称">
                </div>

                <div class="form-group">
                    <label>核心问题 <span class="required">*</span></label>
                    <textarea name="problem" required placeholder="描述项目解决的核心问题（200字以内）"></textarea>
                    <div class="note">请简明扼要地说明项目要解决的核心痛点</div>
                </div>

                <div class="form-group">
                    <label>MVP方案 <span class="required">*</span></label>
                    <textarea name="mvp" required placeholder="描述MVP方案的核心功能和实现思路"></textarea>
                    <div class="note">
                        💡 请使用 <a href="https://f1l5e2ythy.feishu.cn/sync/VFLRdZuFEsjFotbRwkXckpEendg" target="_blank" style="color:#667eea;">MVP方案模板</a> 填写
                    </div>
                </div>

                <div class="form-group">
                    <label>产品工作原理（选填）</label>
                    <textarea name="productPrinciple" placeholder="说明产品的工作流程和技术实现原理"></textarea>
                </div>

                <div class="form-group">
                    <label>效果指标（选填）</label>
                    <textarea name="effectMetrics" placeholder="量化预期效果，如：效率提升XX%、成本降低XX万元/年"></textarea>
                </div>

                <div class="form-group">
                    <label>Demo视频（选填）</label>
                    <div class="upload-area" id="demoUploadArea">
                        <input type="file" id="demoFile" name="demoFile" accept="video/*" style="display:none">
                        <div class="upload-placeholder" id="demoPlaceholder">
                            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12"/>
                            </svg>
                            <p>点击上传Demo视频</p>
                            <span>支持 MP4/AVI/MOV，最大100MB</span>
                        </div>
                        <div class="upload-success" id="demoSuccess" style="display:none">
                            <span class="file-icon">🎬</span>
                            <span id="demoFileName">文件已上传</span>
                            <button type="button" class="remove-file" id="removeDemo">×</button>
                        </div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>队长姓名 <span class="required">*</span></label>
                        <input type="text" name="leaderName" required placeholder="请输入队长姓名">
                    </div>
                    <div class="form-group">
                        <label>队长手机 <span class="required">*</span></label>
                        <input type="tel" name="leaderPhone" required placeholder="请输入手机号">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>队长邮箱 <span class="required">*</span></label>
                        <input type="email" name="leaderEmail" required placeholder="请输入邮箱">
                    </div>
                    <div class="form-group">
                        <label>职位（选填）</label>
                        <input type="text" name="leaderTitle" placeholder="请输入职位">
                    </div>
                </div>

                <div class="form-group">
                    <label>团队成员（选填，最多4人）</label>
                    <div class="form-row">
                        <input type="text" name="member1" placeholder="成员1姓名">
                        <input type="text" name="member2" placeholder="成员2姓名">
                    </div>
                    <div class="form-row" style="margin-top: 12px;">
                        <input type="text" name="member3" placeholder="成员3姓名">
                        <input type="text" name="member4" placeholder="成员4姓名">
                    </div>
                </div>

                <button type="submit" class="btn-submit">提交报名</button>
            </form>
        </div>
    </div>

    <!-- 成功提示弹窗 -->
    <div class="modal-overlay" id="successModal">
        <div class="modal-card">
            <div class="modal-icon">🎉</div>
            <div class="modal-title">报名成功！</div>
            <div class="modal-info" id="modalInfo"></div>
            <button class="modal-btn" onclick="closeModal()">好的</button>
        </div>
    </div>

    <script>
        const API_BASE = 'https://ai-competition-api.janesmitheer.workers.dev';
        let uploadedDemoFileName = '';

        // 分类选项选中效果
        document.querySelectorAll('.category-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.category-option').forEach(o => o.classList.remove('selected'));
                option.classList.add('selected');
            });
        });

        // Demo视频上传处理
        const demoUploadArea = document.getElementById('demoUploadArea');
        const demoFile = document.getElementById('demoFile');
        const demoPlaceholder = document.getElementById('demoPlaceholder');
        const demoSuccess = document.getElementById('demoSuccess');
        const demoFileName = document.getElementById('demoFileName');
        const removeDemo = document.getElementById('removeDemo');

        if (demoUploadArea) {
            demoUploadArea.addEventListener('click', (e) => {
                if (e.target !== removeDemo) {
                    demoFile.click();
                }
            });

            demoFile.addEventListener('change', () => {
                if (demoFile.files[0]) {
                    handleDemoFile(demoFile.files[0]);
                }
            });

            removeDemo.addEventListener('click', (e) => {
                e.stopPropagation();
                demoFile.value = '';
                uploadedDemoFileName = '';
                demoPlaceholder.style.display = 'block';
                demoSuccess.style.display = 'none';
            });
        }

        function handleDemoFile(file) {
            // 验证文件大小（100MB）
            if (file.size > 100 * 1024 * 1024) {
                alert('文件大小不能超过100MB');
                return;
            }
            // 验证文件类型
            if (!file.name.match(/\.(mp4|avi|mov|wmv|flv)$/i)) {
                alert('只支持 MP4/AVI/MOV/WMV/FLV 格式');
                return;
            }
            uploadedDemoFileName = file.name;
            demoPlaceholder.style.display = 'none';
            demoSuccess.style.display = 'flex';
            demoFileName.textContent = file.name;
        }

        // 弹窗关闭
        function closeModal() {
            document.getElementById('successModal').classList.remove('show');
        }

        // 点击遮罩关闭
        document.getElementById('successModal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('successModal')) {
                closeModal();
            }
        });

        // ESC键关闭
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') closeModal();
        });

        // 表单提交
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const form = e.target;
            const submitBtn = form.querySelector('.btn-submit');
            const originalText = submitBtn.textContent;

            // 验证手机号
            const phone = form.leaderPhone.value;
            if (!/^1[3-9]\d{9}$/.test(phone)) {
                alert('请输入正确的11位手机号');
                return;
            }

            // 验证邮箱
            const email = form.leaderEmail.value;
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                alert('请输入正确的邮箱地址');
                return;
            }

            // 显示加载状态
            submitBtn.disabled = true;
            submitBtn.textContent = '提交中...';

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // 构造 API 请求体
            const categoryMap = { sales: '销售提效', supply: '供应链优化', rd: '研发辅助', operation: '内部运营', custom: '自拟' };
            const nowMs = Date.now();
            const payload = {
                '团队名称': data.teamName,
                '所属部门': data.department || '',
                '作品分类': categoryMap[data.category] || '',
                '作品名称': data.projectName,
                '核心问题': data.problem || '',
                'MVP方案': data.mvp || '',
                '效果指标': data.effectMetrics || '',
                '产品工作原理': data.productPrinciple || '',
                '队长': data.leaderName,
                '队长手机': data.leaderPhone,
                '队长邮箱': data.leaderEmail,
                '职位': data.leaderTitle || '',
                '成员1': data.member1 || '',
                '成员2': data.member2 || '',
                '成员3': data.member3 || '',
                '成员4': data.member4 || '',
                '报名时间': nowMs,
            };

            try {
                let response;
                if (demoFile.files[0]) {
                    // 有文件：用 multipart/form-data 发送
                    const fd = new FormData();
                    fd.append('json', JSON.stringify(payload));
                    fd.append('demoVideo', demoFile.files[0]);
                    response = await fetch(`${API_BASE}/api/register`, {
                        method: 'POST',
                        body: fd
                    });
                } else {
                    // 无文件：用 JSON 发送
                    response = await fetch(`${API_BASE}/api/register`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                }

                const result = await response.json();

                if (result.success) {
                    // 显示成功弹窗（不清空输入框）
                    document.getElementById('modalInfo').innerHTML = `
                        <div style="text-align:left; background:rgba(255,255,255,0.05); padding:20px; border-radius:12px; margin-top:10px;">
                            <div style="margin-bottom:12px;"><strong>团队名称：</strong>${data.teamName}</div>
                            <div style="margin-bottom:12px;"><strong>作品名称：</strong>${data.projectName}</div>
                            <div><strong>队长：</strong>${data.leaderName}</div>
                        </div>
                        <div style="margin-top:20px; color:#28a745; font-size:14px;">✅ 请等待管理员审核</div>
                    `;
                    document.getElementById('successModal').classList.add('show');
                } else {
                    alert('提交失败：' + (result.error || '未知错误，请稍后重试'));
                }
            } catch (error) {
                console.error('提交错误:', error);
                alert('网络错误，请检查网络后重试');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = originalText;
            }
        });
    </script>
</body>
</html>
