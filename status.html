<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>报名状态查询 - AI应用创新先锋大赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
            padding: 40px 20px;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            color: rgba(255,255,255,0.7);
        }
        .back-link {
            color: #667eea;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            margin-bottom: 20px;
        }
        .search-card {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 24px;
            padding: 40px;
            text-align: center;
        }
        .search-form {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
        }
        input {
            flex: 1;
            padding: 16px 20px;
            border: 2px solid rgba(255,255,255,0.15);
            border-radius: 12px;
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 16px;
        }
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        button {
            padding: 16px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
        }
        button:hover {
            transform: translateY(-2px);
        }
        .result-card {
            display: none;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 30px;
            margin-top: 30px;
            text-align: left;
        }
        .result-card.show {
            display: block;
        }
        .status-badge {
            display: inline-block;
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 20px;
        }
        .status-pending {
            background: rgba(255, 193, 7, 0.2);
            color: #ffc107;
        }
        .status-approved {
            background: rgba(40, 167, 69, 0.2);
            color: #28a745;
        }
        .status-rejected {
            background: rgba(220, 53, 69, 0.2);
            color: #dc3545;
        }
        .info-grid {
            display: grid;
            gap: 16px;
        }
        .info-item {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .info-label {
            color: rgba(255,255,255,0.6);
        }
        .info-value {
            font-weight: 600;
        }
        .placeholder {
            text-align: center;
            padding: 60px 20px;
            color: rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="index.html" class="back-link">← 返回首页</a>
        
        <header>
            <h1>🔍 报名状态查询</h1>
            <p class="subtitle">第一届AI应用创新先锋大赛</p>
        </header>

        <div class="search-card">
            <div class="search-form">
                <input type="tel" id="phoneInput" placeholder="请输入队长手机号">
                <button onclick="searchStatus()">查询</button>
            </div>

            <div id="placeholder" class="placeholder">
                请输入手机号查询报名状态
            </div>

            <div id="result" class="result-card">
                <span id="statusBadge" class="status-badge">待审核</span>
                <div class="info-grid">
                    <div class="info-item">
                        <span class="info-label">团队名称</span>
                        <span id="teamName" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">作品名称</span>
                        <span id="projectName" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">报名时间</span>
                        <span id="submitTime" class="info-value">-</span>
                    </div>
                    <div class="info-item">
                        <span class="info-label">审核时间</span>
                        <span id="reviewTime" class="info-value">-</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function searchStatus() {
            const phone = document.getElementById('phoneInput').value.trim();
            if (!phone) {
                alert('请输入手机号');
                return;
            }
            
            // TODO: 调用后端API查询
            // 暂时显示示例数据
            document.getElementById('placeholder').style.display = 'none';
            document.getElementById('result').classList.add('show');
            
            document.getElementById('teamName').textContent = '示例团队';
            document.getElementById('projectName').textContent = 'AI智能助手';
            document.getElementById('submitTime').textContent = '2026-04-01 14:30';
            document.getElementById('reviewTime').textContent = '-';
            
            document.getElementById('statusBadge').textContent = '待审核';
            document.getElementById('statusBadge').className = 'status-badge status-pending';
        }
    </script>
</body>
</html>
