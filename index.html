<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>第一届AI应用创新先锋大赛</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Header */
        header {
            text-align: center;
            padding: 60px 20px;
        }
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 8px 20px;
            border-radius: 30px;
            font-size: 14px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .subtitle {
            font-size: 20px;
            color: rgba(255,255,255,0.8);
            margin-bottom: 40px;
        }
        /* Timeline */
        .timeline {
            display: flex;
            justify-content: center;
            gap: 30px;
            flex-wrap: wrap;
            margin: 40px 0;
        }
        .timeline-item {
            background: rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 16px;
            padding: 20px 30px;
            text-align: center;
            min-width: 200px;
        }
        .timeline-date {
            font-size: 14px;
            color: #667eea;
            margin-bottom: 8px;
        }
        .timeline-title {
            font-size: 18px;
            font-weight: 600;
        }
        /* CTA */
        .cta-section {
            text-align: center;
            padding: 60px 20px;
        }
        .btn {
            display: inline-block;
            padding: 16px 40px;
            border-radius: 30px;
            font-size: 18px;
            font-weight: 600;
            text-decoration: none;
            margin: 10px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-secondary {
            background: transparent;
            border: 2px solid rgba(255,255,255,0.3);
            color: #fff;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }
        /* Features */
        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
            padding: 60px 20px;
        }
        .feature-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
        }
        .feature-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        .feature-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 12px;
        }
        .feature-desc {
            color: rgba(255,255,255,0.7);
            line-height: 1.6;
        }
        /* Footer */
        footer {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.5);
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="badge">🚀 2026年度大赛</div>
            <h1>第一届AI应用创新先锋大赛</h1>
            <p class="subtitle">汇聚创新力量，赋能AI应用落地</p>
        </header>

        <section class="timeline">
            <div class="timeline-item">
                <div class="timeline-date">4月1日-24日</div>
                <div class="timeline-title">📝 报名阶段</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-date">4月27日-5月7日</div>
                <div class="timeline-title">📋 初筛评审</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-date">5月8日-13日</div>
                <div class="timeline-title">🗳️ 人气投票</div>
            </div>
            <div class="timeline-item">
                <div class="timeline-date">5月14日</div>
                <div class="timeline-title">🏆 决赛颁奖</div>
            </div>
        </section>

        <section class="features">
            <div class="feature-card">
                <div class="feature-icon">💰</div>
                <div class="feature-title">丰厚奖金</div>
                <div class="feature-desc">一等奖5000元，二等奖3000元，三等奖1000元</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🎓</div>
                <div class="feature-title">大咖指导</div>
                <div class="feature-desc">行业专家面对面点评辅导</div>
            </div>
            <div class="feature-card">
                <div class="feature-icon">🚀</div>
                <div class="feature-title">孵化机会</div>
                <div class="feature-desc">优质项目获得孵化支持</div>
            </div>
        </section>

        <section class="cta-section">
            <a href="register.html" class="btn btn-primary">立即报名</a>
            <a href="status.html" class="btn btn-secondary">查询状态</a>
        </section>

        <footer>
            <p>© 2026 AI应用创新先锋大赛组委会</p>
        </footer>
    </div>
</body>
</html>
